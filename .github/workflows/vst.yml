name: di75 VST3

on:
  push:
    branches: [main]
    paths: ['vst/**', '.github/workflows/vst.yml']
    tags: ['v*']
  pull_request:
    paths: ['vst/**', '.github/workflows/vst.yml']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -S vst -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: di75-vst3
          path: build/di75_artefacts/Release/VST3/di75.vst3

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -S vst -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Zip
        run: Compress-Archive -Path "build/di75_artefacts/Release/VST3/di75.vst3" -DestinationPath "di75-vst3-windows.zip"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: di75-vst3-windows.zip
          generate_release_notes: true
