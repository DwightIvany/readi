name: di75 VST3

on:
  push:
    branches: [main]
    paths: ['vst/**', '.github/workflows/vst.yml']
    tags: ['v*']
  pull_request:
    paths: ['vst/**', '.github/workflows/vst.yml']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # the windows-latest image now ships Visual Studio 2026 (no VS2022), so
      # don't name a VS generator; set up the MSVC toolchain and use Ninja
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -B build -S vst -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: di75-vst3
          path: build/di75_artifacts/Release/VST3/di75.vst3

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -B build -S vst -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Zip
        run: Compress-Archive -Path "build/di75_artifacts/Release/VST3/di75.vst3" -DestinationPath "di75-vst3-windows.zip"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: di75-vst3-windows.zip
          generate_release_notes: true
